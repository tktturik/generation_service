
[tool.ruff]
output-format = "full"
src = ["generation_service", "providers"]
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    "build",
    "dist",
    "migrations",
    "tests",
]

select = [
    "E",
    "W",
    "F",
    "B",
    "I",
    "C4",
    "UP",
    "PYI",
]

[tool.mypy]
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "tests",
]
ignore_missing_imports = true
